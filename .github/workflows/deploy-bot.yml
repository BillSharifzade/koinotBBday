name: Deploy Telegram bot

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/deploy-bot.yml']
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - name: Skip without Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to deploy the bot from GitHub."
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      # Secrets (BOT_TOKEN, WEBHOOK_SECRET) are stored in the Worker and survive deploys.
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
